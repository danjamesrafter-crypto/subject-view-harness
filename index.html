/* Layout: Flywheel shell — sidebar rail | collapsible subject list | subject workspace. Tokens are the Vision Design System (VDS, @flywheel-io/vision 22.1.2) dark theme, mapped onto this page's names. */
:root{
  color-scheme:dark;
  --chrome:#0a1936;        /* --sidebar-base */
  --page:#000104;          /* --page-shaded (dark) */
  --card:#030e23;          /* --card-background */
  --card-2:#0a1a36;        /* --card-header */
  --line:#1e3154;          /* --separations-base */
  --line-soft:#14233f;     /* between card and separations (derived) */
  --line-strong:#405e97;   /* --separations-border */
  --ink:#ffffff;           /* --typography-base */
  --ink-2:#cad7e7;         /* --typography-muted */
  --ink-3:#8595ab;         /* --typography-light */
  --ink-dis:#4e5665;       /* --typography-disabled */
  --on-accent:#030a19;     /* --typography-contrast */
  --accent:#76a4fc;        /* --primary-base */
  --accent-ink:#76a4fc;
  --accent-strong:#1b68fa; /* --primary-base (light theme) for brand fills */
  --accent-wash:#76a4fc33; /* --primary-hover */
  --accent-border:#76a4fc80;
  --ok:#7adc9e; --ok-wash:#7adc9e33;        /* --green-base / hover */
  --warn:#f9c56d; --warn-wash:#f9c56d33;    /* --orange-base / hover */
  --bad:#f15757; --bad-wash:#f58f8f33;      /* --red-base / hover */
  --info:#d0b3fd; --info-wash:#d0b3fd33;    /* --secondary-base / hover */
  --ok-border:#7adc9e80; --warn-border:#f9c56d80; --bad-border:#f58f8f80; --info-border:#d0b3fd80; /* --*-border */
  --shadow-l:0 5px 15px 0 rgb(0 0 0 / .10); /* .vision-shadow-large */
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.app{display:grid;grid-template-columns:56px auto 1fr;grid-template-rows:52px 1fr;height:100%;min-height:0}
/* rail */
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
svg.i.s{width:16px;height:16px}
/* top bar */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.tbtn{height:32px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.tbtn:hover{color:var(--ink);border-color:var(--accent)}
.tbtn.on{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-wash)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-strong);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
/* subject list */
.list{grid-row:2;width:300px;background:var(--chrome);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0;transition:width .2s}
.list.collapsed{width:0;overflow:hidden;border:0}
.list-h{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line-soft)}
.list-h .row{display:flex;align-items:center;justify-content:space-between}
.list-h h2{margin:0;font-size:14px;color:var(--ink);font-weight:500}
.search{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--page)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.subs{overflow:auto;flex:1;padding:6px}
.srow{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;color:var(--ink)}
.srow:hover{background:var(--card)}
.srow.on{background:var(--card-2);border-color:var(--line)}
.srow .lbl{font-weight:600;font-family:var(--font-data);font-size:13px}
.srow .meta{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.flagn{display:inline-flex;gap:4px}
.fl{min-width:18px;height:18px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.fl.bad{background:var(--bad-wash);color:var(--bad)} .fl.warn{background:var(--warn-wash);color:var(--warn)} .fl.info{background:var(--info-wash);color:var(--info)}
/* main */
main{grid-row:2;grid-column:3;overflow:auto;min-width:0;min-height:0}
.wrap{padding:20px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 24px;display:flex;flex-direction:column;gap:16px;max-width:1440px}
.shead{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-start;justify-content:space-between}
.idblock{display:flex;flex-direction:column;gap:6px;min-width:0}
.idblock h1{margin:0;font-family:var(--font-ui);font-size:22px;font-weight:500}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:500}
.phi{font-family:var(--font-data);background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:1px 7px;color:var(--ink-3);font-size:12px}
.phi.shown{border-style:solid;color:var(--warn);border-color:var(--warn-border)}
.status-on{background:var(--ok-wash);color:var(--ok)} .status-off{background:var(--bad-wash);color:var(--bad)}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.cond{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tabsbar{position:sticky;top:0;z-index:6;background:var(--page);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-inline:-4px;padding-inline:4px}
.tabsbar .nav{display:flex;gap:4px;margin-left:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0}
.ibtn{height:28px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:0 9px;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.ibtn:hover{color:var(--ink);border-color:var(--accent)}
.ibtn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ibtn:disabled{opacity:.45;cursor:not-allowed}
/* subject matrix (visits × data types) */
.mx{overflow-x:auto}
.mx table{border-collapse:separate;border-spacing:0;width:100%;min-width:720px}
.mx th,.mx td{border-bottom:1px solid var(--line-soft);padding:0;white-space:nowrap}
.mx thead th{position:sticky;top:0;background:var(--card);z-index:1}
.mx .rl{position:sticky;left:0;background:var(--card);z-index:2;text-align:left;padding:8px 14px;font-size:13px;color:var(--ink-2);font-weight:500;min-width:150px}
.mx .grp td{padding:12px 14px 4px;font-size:12px;color:var(--ink-3);font-weight:500;border-bottom:0}
.mx .grp td.rl{background:var(--card)}
.vh{width:100%;border:0;background:transparent;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;color:var(--ink);border-radius:8px}
.vh:hover{background:var(--card-2)}
.vh b{font-size:13px} .vh small{font-family:var(--font-data);font-size:11px;color:var(--ink-3)}
.vh .bar{height:3px;width:100%;border-radius:2px}
.cell{width:100%;min-height:36px;border:0;background:transparent;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:12px;text-align:left;color:var(--ink-2);border-radius:6px;font-family:var(--font-data)}
.cell:hover:not(:disabled){background:var(--card-2);color:var(--ink)}
.cell:disabled{cursor:default}
.cell .g{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;font-size:10px;font-weight:700;flex:none;font-family:var(--font-ui)}
.cell.ok .g{background:var(--ok-wash);color:var(--ok)} .cell.bad .g{background:var(--bad-wash);color:var(--bad)} .cell.warn .g{background:var(--warn-wash);color:var(--warn)}
.cell.info .g{background:var(--info-wash);color:var(--info)} .cell.pend .g{border:1.5px dashed var(--ink-3);color:var(--ink-3)}
.cell.bad{color:var(--bad)} .cell.warn{color:var(--warn)} .cell.na{color:var(--line)}
.cell.sel,.vh.sel{outline:2px solid var(--accent);outline-offset:-2px}
/* detail pane */
.pane{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--chrome);border-left:1px solid var(--line);z-index:18;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0;box-shadow:-8px 0 25px rgba(0,0,0,.5)}
.pane>header{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.bc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.bc button{border:0;background:none;padding:0;color:var(--accent-ink)} .bc button:hover{text-decoration:underline}
.bc i{color:var(--line);font-style:normal} .bc b{font-weight:600}
.pane .body{overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px}
.psec{display:flex;flex-direction:column;gap:8px}
.psec>h4{margin:0;font-size:12px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:8px}
.acq{border:1px solid var(--line-soft);border-radius:9px;background:var(--page);overflow:hidden}
.acq-h{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.acq-h b{font-weight:500}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line-soft);font-size:12px}
.frow .nm{font-family:var(--font-data);overflow-wrap:anywhere}
.frow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.fmeta{grid-column:1/-1;background:var(--card);border-radius:6px;padding:8px 10px}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0}
.tab{border:0;background:transparent;padding:10px 14px;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:11px;background:var(--card-2);border-radius:999px;padding:0 6px;color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:500;color:var(--ink)}
.card-h{background:var(--card-2);border-radius:12px 12px 0 0}
.card-b{padding:14px 16px}
.src{font-size:11px;color:var(--ink-3);font-family:var(--font-data)}
/* swimlane */
/* visit detail */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
/* body map */
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.mono,th.r,td.r{white-space:nowrap}
td.r,th.r{text-align:right}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.completed,.st.complete,.st.closed{color:var(--ok);background:var(--ok-wash)}
.st.in_progress,.st.running,.st.answered{color:var(--accent-ink);background:var(--accent-wash)}
.st.todo,.st.pending,.st.open{color:var(--warn);background:var(--warn-wash)}
.st.blocked,.st.cancelled{color:var(--ink-3);background:var(--card-2)}
.st.failed{color:var(--bad);background:var(--bad-wash)}
.lnk{color:var(--accent-ink);text-decoration:none;border:0;background:none;padding:0;display:inline-flex;gap:4px;align-items:center}
.lnk:hover{text-decoration:underline}
/* imaging */
.sess{border:1px solid var(--line-soft);border-radius:10px;background:var(--page);overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.files{border-top:1px solid var(--line-soft)}
/* forms */
.forms{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.btn{height:34px;border-radius:8px;padding:0 14px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled{opacity:.45;cursor:not-allowed}
td .btn{height:28px;padding:0 10px;font-size:12px;white-space:nowrap}
/* activity */
/* api drawer */
.call{border:1px solid var(--line-soft);border-radius:8px;padding:10px;background:var(--page);display:flex;flex-direction:column;gap:4px}
.call code{font-family:var(--font-data);font-size:12px;color:var(--accent-ink);word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.empty-s{padding:24px;text-align:center;color:var(--ink-3)}
@media (max-width:1100px){.forms{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
  .list{grid-row:2;grid-column:1;width:auto;max-height:42vh;border-right:0;border-bottom:1px solid var(--line-soft)}
  .list.collapsed{max-height:0;width:auto}
  main{grid-row:3;grid-column:1}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.kv2{font-size:28px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.ks{font-size:13px;color:var(--ink-3)}
.kpi.bad .kv2{color:var(--bad-t)} .kpi.warn .kv2{color:var(--warn-t)}
.tabsbar{background:var(--page);border-bottom-color:var(--line-soft)}
.tab{height:44px;padding:0 14px;color:var(--ink-3);font-size:14px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}

.card-h{background:transparent;border-bottom:1px solid var(--line-soft);padding:16px 20px;border-radius:14px 14px 0 0}
.card-h h3{font-size:15px;font-weight:600;color:var(--ink)}
.card-b{padding:16px 20px}
.src{color:var(--ink-4)}

tbody tr:hover td{background:var(--rowhover)}
td.mono{font-family:var(--font-data)}

.st{border-radius:999px;font-size:12px;padding:2px 9px}
.fl.bad{color:var(--bad-t)} .fl.warn{color:var(--warn-t)} .fl.info{color:var(--info-t)}
.cell.bad{color:var(--bad-t)} .cell.warn{color:var(--warn-t)} .cell.ok .g{color:var(--ok-t)} .cell.bad .g{color:var(--bad-t)} .cell.warn .g{color:var(--warn-t)} .cell.info .g{color:var(--info-t)}

.mx thead th{text-transform:none;letter-spacing:0}
.mx th,.mx td{border-bottom-color:var(--line-soft)}
.pane{background:var(--chrome);border-left-color:var(--line)}
.psec>h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.acq,.sess{background:var(--page);border-color:var(--line-soft);border-radius:10px}
.toast{background:var(--card-2);border-color:var(--line-strong);border-radius:10px}
/* header: actions top-right, Fermi brief fills the space under them */
.shead{display:grid;grid-template-columns:minmax(0,1fr) minmax(440px,580px);align-items:stretch;gap:16px 24px}
.hright{display:flex;flex-direction:column;gap:10px;min-width:0}
.hactions{justify-content:flex-end;flex-wrap:nowrap}
.hactions .btn{height:36px}
@media (max-width:1180px){.shead{grid-template-columns:1fr}.hactions{justify-content:flex-start;flex-wrap:wrap}}
/* series hover preview */
.pop[hidden]{display:none}
.pop{position:fixed;z-index:30;width:500px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;background:var(--chrome);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.55);padding:12px;display:flex;flex-direction:column;gap:10px}
.ibtn.on{background:var(--accent-wash);border-color:var(--accent-border);color:var(--blue-t)}
pre.logx{margin:0;background:#04080F;border:1px solid var(--line-soft);border-radius:8px;padding:10px;font:11.5px/1.6 var(--font-data);color:var(--ink-3);overflow-x:auto;white-space:pre}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{grid-row:1;grid-column:1;width:auto;max-height:46vh;border-right:0;border-bottom:1px solid var(--line-soft)}
  .side.collapsed{width:auto;max-height:none}
  .side.collapsed .side-mini{flex-direction:row;padding:10px 16px}
  main{grid-row:2;grid-column:1}
  .wrap{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .side .me{display:none}
}



/* harness additions */
html,body{height:100%}
[hidden]{display:none!important}
.app{height:100vh}
.side .srow .meta{font-family:var(--font-ui)}

  if (!r || r === "info") { const kv = flatKV(z.info || {}, "", []); body += sec("Session custom info", kv.length ? `<div class="kvgrid">${kv.slice(0, 40).map(([k, v]) => `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>` : `<span class="muted">No custom info.</span>`); }
  host.innerHTML = `<aside class="pane" role="dialog" aria-label="${esc(z.label)}"><header><div style="display:flex;align-items:center;gap:8px"><nav class="bc"><button data-act="closePane">${esc(s.label)}</button><i>›</i>${r ? `<button data-pane="${col.key}|">${esc(z.label)}</button><i>›</i><b>${esc(r === "req" ? "Visit requirements" : r.replace("mod:", ""))}</b>` : `<b>${esc(z.label)}</b>`}</nav><span style="flex:1"></span>${nav}</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="src">${dt(z.timestamp || z.created)} · ${as.length} acquisitions</span>${(st => st.k ? `<span class="vst-pill" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--${st.k}-t)"><i class="vd ${st.k}"></i>${esc(st.all)}</span>` : "")(sessStatus(z, S.subj, col.v))}<a class="lnk" style="font-size:12px" href="${coreLink("sessions", z._id)}" target="_blank" rel="noopener">Open session in Flywheel ↗</a></div></header><div class="body">${body}</div></aside>`;
}
function render() {
  renderSide();
  const v = document.getElementById("view");
  if (S.error) { v.innerHTML = `<div class="card"><div class="empty-big"><b style="color:var(--ink)">Can't load the Subject View</b><span>${esc(S.error)}</span><button class="btn" data-act="refresh">Try again</button></div></div>`; pane(); return; }
  if (S.loading && !S.project) { v.innerHTML = `<div class="loading"><span class="spin"></span>Loading project…</div>`; return; }
  const s = S.subjects.find(x => x._id === S.subj);
  if (!s) { v.innerHTML = `<div class="card"><div class="empty-big">${S.subjects.length ? "Pick a subject." : "This project has no subjects yet."}</div></div>${S.tab === "diagnostics" ? diagTab() : ""}`; pane(); return; }
  const d = S.detail[s._id];
  const body = { overview: () => matrix(s, d), tasks: () => tasksTab(s, d), clinical: () => infoTab(s, d), diagnostics: diagTab }[S.tab]();
  v.innerHTML = header(s, d) + tabs() + body;
  pane();
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-filt],[data-subj],[data-tab],[data-pane],[data-act],[data-fmeta],[data-log],[data-diag],[data-job],#toggleList,#toggleList2,#fsBtn"); if (!t) return;
  if (t.dataset.job) { S.job = t.dataset.job; S.fullLog = false; if (!S.jobData[S.job] || S.jobData[S.job].err) { delete S.jobData[S.job]; loadJob(S.job); } else render(); return; }
  if (t.id === "toggleList" || t.id === "toggleList2") { document.getElementById("list").classList.toggle("collapsed"); return; }
  if (t.id === "fsBtn") { try { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => toast("Full screen isn't allowed in this frame")); } catch (er) {} return; }
  if (t.dataset.filt) { S.filt = t.dataset.filt; renderSide(); return; }
  if (t.dataset.subj) { S.subj = t.dataset.subj; S.pane = null; loadSubject(S.subj); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
  if (t.dataset.pane != null) { if (t.disabled) return; const [z, r] = t.dataset.pane.split("|"); S.pane = { z, r: r || null }; render(); return; }
  if (t.dataset.fmeta) { S.fileOpen[t.dataset.fmeta] = !S.fileOpen[t.dataset.fmeta]; render(); return; }
  if (t.dataset.log) { const id = t.dataset.log; const r = await api(`/api/jobs/${id}/logs`, null, { soft: true }); S.logs[id] = r ? (listOf(r.logs || r).map(x => x.msg || x).join("") || JSON.stringify(r).slice(0, 2000)).split("\n").slice(-25).join("\n") : "Log not available through the extension proxy (see Diagnostics)."; render(); return; }
  if (t.dataset.diag != null) { S.diagOpen = S.diagOpen === +t.dataset.diag ? -1 : +t.dataset.diag; render(); return; }
  const a = t.dataset.act;
  if (a === "phi") { S.phi = !S.phi; render(); }
  if (a === "refresh") { S.detail = {}; S.error = null; loadAll(); }
  if (a === "closePane") { S.pane = null; render(); }
  if (a === "closeJob") { S.job = null; render(); }
  if (a === "fulllog") { S.fullLog = !S.fullLog; render(); }
  if (a === "copyjob") { try { await navigator.clipboard.writeText(S.job); toast("Job ID copied"); } catch (er) { toast("Copy blocked by the frame: " + S.job); } }
  if (a === "dllog") { const J = S.jobData[S.job]; try { const u = URL.createObjectURL(new Blob([(J.lines || []).join("\n")], { type: "text/plain" })); const l = document.createElement("a"); l.href = u; l.download = `job-${S.job}.log`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); } catch (er) { toast("Download blocked by the frame. Use Open in Jobs Log."); } }
  if (a === "diagnext") { S.diagOpen = 0; render(); }
  if (a === "copydiag") { const txt = JSON.stringify({ version: VERSION, origin: S.origin, project: S.projectId, calls: S.calls }, null, 2); try { await navigator.clipboard.writeText(txt); toast("Diagnostics copied"); } catch (er) { toast("Copy blocked by the frame. Open Diagnostics and select the text."); } }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; renderSide(); } });
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (S.job) { S.job = null; render(); } else if (S.pane) { S.pane = null; render(); } });
let lastRefresh = 0; const softRefresh = () => { if (!S.ext || Date.now() - lastRefresh < 4000) return; lastRefresh = Date.now(); S.detail = {}; loadAll(true); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) softRefresh(); });
window.addEventListener("focus", softRefresh);
setInterval(() => { if (!document.hidden) softRefresh(); }, 60000);
connect();
</script>
</body>
