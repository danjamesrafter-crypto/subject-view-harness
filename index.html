  --red-base:rgba(241,87,87,1);--red-medium:rgba(239,68,68,1);--red-dark:rgba(191,54,54,1);--red-light:rgba(253,236,236,1);--red-hover:rgba(245,143,143,.15);--red-focus:rgba(245,143,143,.25);--red-border:rgba(245,143,143,.50);
  --separations-base:rgba(30,49,84,1);--separations-border:rgba(64,94,151,1);--separations-divider:rgba(255,255,255,.2);--separations-input:rgba(255,255,255,.35);--separations-overlay:rgba(0,0,0,.35);
  --typography-base:rgba(255,255,255,1);--typography-contrast:rgba(3,10,25,1);--typography-muted:rgba(202,215,231,1);--typography-light:rgba(133,149,171,1);--typography-disabled:rgba(78,86,101,1);
  --shadow-base:rgba(0,0,0,.10);--shadow-light:rgba(0,0,0,.50);--shadow-medium-c:rgba(0,0,0,.08);
}
:root{
  /* effects / type / spacing (tokens/effects.css, typography.css, spacing.css) */
  --shadow-small:0 1px 2px 0 var(--shadow-light);--shadow-medium:0 2px 5px 0 var(--shadow-base);--shadow-large:0 5px 15px 0 var(--shadow-base);--shadow-extra-large:0 8px 25px 0 var(--shadow-base);--shadow-menu:0 5px 15px 0 rgba(0,0,0,.10);
  --ease-pop:cubic-bezier(.16,1,.3,1);--ease-collapse:cubic-bezier(.87,0,.13,1);
  --font-sans:"Inter",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* App aliases -> Vision tokens (kept so existing markup and inline styles resolve in both modes) */
:root,.vision-light,.vision-dark{
  --page:var(--page-light);--chrome:var(--card-header);--card:var(--card-background);--card-2:var(--card-header);--hover:var(--slate-hover);--rowhover:var(--slate-hover);
  --line:var(--separations-base);--line-soft:var(--separations-base);--line-strong:var(--separations-border);
  --ink:var(--typography-base);--ink-2:var(--typography-muted);--ink-3:var(--typography-light);--ink-4:var(--typography-disabled);--on-accent:var(--typography-contrast);
  --accent:var(--primary-base);--accent-ink:var(--primary-base);--accent-wash:var(--primary-hover);--accent-border:var(--primary-border);--blue-t:var(--primary-base);
  --ok:var(--green-base);--ok-t:var(--green-base);--ok-wash:var(--green-hover);--ok-border:var(--green-border);
  --warn:var(--orange-base);--warn-t:var(--orange-base);--warn-wash:var(--orange-hover);--warn-border:var(--orange-border);
  --bad:var(--red-base);--bad-t:var(--red-base);--bad-wash:var(--red-hover);--bad-border:var(--red-border);
  --info:var(--secondary-base);--info-t:var(--secondary-base);--info-wash:var(--secondary-hover);--info-border:var(--secondary-border);
  --font-ui:var(--font-sans);--font-data:var(--font-mono);
}

/* ---------- base (lib/index.css) ---------- */
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;font-family:var(--font-sans);font-size:14px;line-height:140%;font-weight:400;color:var(--typography-base);background:var(--page-light);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,h5,h6{margin:0;font-weight:500;color:var(--typography-base)}
:focus-visible{outline:2px solid var(--primary-base);outline-offset:-2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--typography-light)}
.src{font-size:12px;color:var(--typography-light)}
.vi{font-size:20px;width:20px;height:20px;text-align:center}
.vi.s,.vi-sm{font-size:16px;width:16px;height:16px}
/* ScrollLayout: 10px scrollbar, slate track, light thumb */
*{scrollbar-width:thin;scrollbar-color:var(--typography-light) var(--slate-hover)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--slate-hover)}
::-webkit-scrollbar-thumb{background:var(--typography-light);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr;height:100vh;min-height:0}
main{grid-row:1;grid-column:2;overflow:auto;min-width:0;min-height:0;background:var(--page-light)}
.wrap{padding:24px 24px 48px;display:flex;flex-direction:column;gap:16px;max-width:1520px}
.loading{display:flex;align-items:center;gap:8px;color:var(--typography-light);padding:24px;font-size:12px}
.empty-s{padding:24px 16px;text-align:center;color:var(--typography-light);font-size:12px}
.empty-big{padding:48px 24px;text-align:center;color:var(--typography-muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty-big .vi{font-size:48px;width:48px;height:48px;color:var(--typography-light)}

/* ProgressSpinner (small, 20px) */
.spin{width:20px;height:20px;border:3px solid var(--separations-divider);border-top-color:var(--primary-base);border-radius:50%;animation:sp 1568ms linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Navbar-style subject list ---------- */
.side{grid-row:1;grid-column:1;width:272px;background:var(--card-header);border-right:1px solid var(--separations-base);display:flex;flex-direction:column;min-height:0;transition:width .33s ease-in-out}
.side .side-mini{display:none}
.side-full{display:flex;flex-direction:column;min-height:0;flex:1}
.side.collapsed{width:60px}
.side.collapsed .side-full{display:none}
.side.collapsed .side-mini{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 8px}
.brand{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px;min-height:52px}
.brand-l{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.wordmark{height:20px;width:auto;align-self:flex-start}
.mark{width:22px;height:auto}
.cap{font-size:10px;line-height:130%;color:var(--typography-light)}
.vision-light .wordmark #Combined-Shape{fill:#000!important}
.list-h{padding:8px 12px 8px;display:flex;flex-direction:column;gap:8px}
.list-h .row{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.list-h h2{margin:0;font-size:12px;font-weight:500;line-height:130%;color:var(--typography-muted)}
/* TextInput (medium 36px, 6px radius) */
.search{display:flex;align-items:center;gap:5px;height:36px;padding:8px;border:1px solid var(--separations-input);border-radius:6px;background:var(--card-background);color:var(--typography-light)}
.search:focus-within{border-color:var(--primary-base)}
.search input{all:unset;flex:1;min-width:0;font-size:14px;color:var(--typography-base)}
.search input::placeholder{color:var(--typography-light)}
.search .vi{font-size:20px;width:20px;height:20px;color:var(--slate-base)}
.schedline{font-size:10px;line-height:130%;color:var(--typography-light);padding:0 4px}
/* Chip (16px radius, 1px 40% border, 12px) used as filter chips */
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:4px;border-radius:16px;border:1px solid var(--slate-border);background:transparent;color:var(--slate-base);padding:2px 10px;font-size:12px;line-height:140%;font-weight:600;transition:all 300ms ease-in-out}
.fchip:hover:not(.on){background:var(--slate-hover)}
.fchip.on{background:var(--primary-base);border-color:var(--primary-base);color:var(--typography-contrast)}
.fchip b{font-weight:400;opacity:.8;margin-left:2px}
.subs{overflow:auto;flex:1;padding:4px 0}
.srow{position:relative;width:calc(100% - 8px);margin:1px 4px;text-align:left;border:0;background:transparent;border-radius:6px;padding:8px 12px 8px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;color:var(--typography-muted)}
.srow:hover{background:var(--primary-hover)}
.srow:hover .lbl,.srow.on .lbl{color:var(--typography-base)}
.srow.on{background:var(--primary-hover)}
.srow.on::before{content:"";position:absolute;left:0;top:12px;height:16px;border-left:3px solid var(--primary-base)}
.srow .lbl{font-size:12px;font-weight:500;line-height:130%;color:var(--typography-muted);font-family:var(--font-mono)}
.srow .meta{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;line-height:130%;color:var(--typography-light)}
.flagn{display:inline-flex;gap:4px}
.me{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-top:1px solid var(--separations-base)}
.me>div{flex:1;min-width:0}
.avatar{width:32px;height:32px;border-radius:9999px;color:var(--typography-contrast);background:var(--primary-base);font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;flex:none;text-transform:uppercase;color:#fff}
/* visit dots */
.vdots{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.vd{width:8px;height:8px;border-radius:50%;background:var(--slate-focus);flex:none}
.vd.ok{background:var(--green-base)}.vd.warn{background:var(--orange-base)}.vd.bad{background:var(--red-base)}
.vd.miss{background:transparent;border:1px dashed var(--typography-light)}

/* ---------- IconButton (30/36/40, 8px radius) ---------- */
.sbtn,.tbtn{width:30px;height:30px;flex:none;border-radius:8px;border:0;background:transparent;color:var(--slate-base);display:inline-flex;align-items:center;justify-content:center;padding:0;transition:all 300ms ease-in-out}
.sbtn:hover,.tbtn:hover{background:var(--slate-hover)}
.sbtn:active,.tbtn:active{background:var(--slate-focus)}
.tbtn .vi,.sbtn .vi{font-size:20px;width:20px;height:20px}

/* ---------- Button (8px radius, Inter 500 14px, 32/36/40) ---------- */
.btn,.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;white-space:nowrap;line-height:1;font-family:var(--font-sans);font-weight:500;font-size:14px;border:1px solid var(--separations-divider);background:transparent;color:var(--slate-base);transition:all 300ms ease-in-out;text-decoration:none;user-select:none}
.btn{height:36px;padding:8px 12px}
.ibtn{height:32px;padding:8px}
.btn .vi,.ibtn .vi{font-size:20px;width:20px;height:20px}
.btn:hover,.ibtn:hover{background:var(--slate-hover)}
.btn:focus-visible,.ibtn:focus-visible{background:var(--slate-focus)}
/* solid primary */
.btn.pri,.ibtn.pri{background:var(--primary-base);border-color:transparent;color:var(--typography-contrast)}
.btn.pri:hover,.ibtn.pri:hover{background:var(--primary-medium)}
.btn.pri:active,.ibtn.pri:active{background:var(--primary-dark)}
/* selected = solid */
.btn.on,.ibtn.on{background:var(--slate-base);border-color:transparent;color:var(--typography-contrast)}
.btn:disabled,.ibtn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:disabled:hover,.ibtn:disabled:hover{background:transparent}
td .btn{height:32px;padding:8px}
a.btn,a.ibtn{text-decoration:none}
/* Fermi = secondary ("discover") hue */
.fermibtn{color:var(--secondary-base)!important;border-color:var(--separations-divider)!important}
.fermibtn:hover{background:var(--secondary-hover)!important}
.fsbtn{position:fixed;right:16px;bottom:16px;z-index:17;background:var(--card-header);width:36px;height:36px;padding:0}
.fsbtn span{display:none}
body:has(.pane) .fsbtn,body:has(.fermi) .fsbtn{display:none}
/* ghost link buttons */
.lnk,.lnkbtn,.evl{color:var(--primary-base);text-decoration:underline;border:0;background:none;padding:0;font:inherit;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.lnk:hover,.lnkbtn:hover,.evl:hover{text-decoration:none}
.lnkbtn{font-size:12px;align-self:flex-start}

/* ---------- Tag (16px, 4px radius, 5% tint, h6 10px) — statuses & counts ---------- */
.fl,.st,.pill,.qst,.tab .n{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:16px;padding:0 4px;border-radius:4px;font-size:10px;font-weight:500;line-height:1;white-space:nowrap;background:var(--slate-hover);color:var(--slate-medium);user-select:none;text-transform:none;letter-spacing:0;border:0}
.vision-dark .fl,.vision-dark .st,.vision-dark .pill,.vision-dark .qst{color:var(--slate-base)}
.fl{min-width:16px}
.fl.bad,.st.failed,.status-off{background:var(--red-hover);color:var(--red-base)}
.fl.warn,.st.todo,.st.pending,.st.open{background:var(--orange-hover);color:var(--orange-base)}
.fl.info,.qst.open{background:var(--secondary-hover);color:var(--secondary-base)}
.st.completed,.st.complete,.st.closed,.status-on{background:var(--green-hover);color:var(--green-base)}
.st.in_progress,.st.running,.st.answered,.qst.answered{background:var(--primary-hover);color:var(--primary-base)}
.st.blocked,.st.cancelled,.qst.closed{background:var(--slate-hover);color:var(--typography-light)}
.vst-pill{font-size:10px}
/* "Live" status: readonly Chip */
.badge-live{display:inline-flex;align-items:center;gap:6px;height:24px;padding:2px 10px;border-radius:16px;border:1px solid var(--green-border);color:var(--green-base);font-size:12px;font-weight:600;white-space:nowrap}
.badge-live i{width:8px;height:8px;border-radius:50%;background:var(--green-base)}
.badge-live.stale{border-color:var(--orange-border);color:var(--orange-base)}
.badge-live.stale i{background:var(--orange-base)}

/* ---------- user tags = Chip with close ---------- */
.tags{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;vertical-align:middle}
.tag{display:inline-flex;align-items:center;gap:2px;border-radius:16px;border:1px solid var(--primary-border);color:var(--primary-base);background:transparent;padding:2px 4px 2px 10px;font-size:12px;line-height:140%;font-weight:600;min-height:22px}
.tags.sm .tag{font-size:10px;padding:0 2px 0 8px;min-height:18px}
.tag:not(:has(.tx)){padding-right:10px}.tags.sm .tag:not(:has(.tx)){padding-right:8px}
.tag .tx{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:inherit;padding:0;border-radius:9999px;width:16px;height:16px;margin-left:2px}
.tag .tx .vi{font-size:16px;width:16px;height:16px}
.tag .tx:hover{background:var(--primary-focus)}
.tagplus{display:inline-flex;align-items:center;gap:2px;border-radius:16px;border:1px solid var(--slate-border);background:transparent;color:var(--slate-base);padding:2px 10px 2px 6px;font-size:12px;line-height:140%;font-weight:600;min-height:22px;transition:all 300ms ease-in-out}
.tagplus .vi{font-size:16px;width:16px;height:16px}
.tags.sm .tagplus{font-size:10px;min-height:18px;padding:0 8px 0 4px}
.tagplus:hover{background:var(--slate-hover)}
.tagin{display:inline-flex;gap:4px;align-items:center}
.tagin input{height:30px;width:160px;border:1px solid var(--primary-base);background:var(--card-background);color:var(--typography-base);border-radius:6px;padding:0 8px;font-size:14px;outline:0}
.tagin .ibtn{height:30px}
.cell .tags{flex-wrap:nowrap;overflow:hidden}
.conds{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;border-radius:16px;border:1px solid var(--slate-border);background:transparent;color:var(--slate-base);padding:2px 10px;font-size:12px;font-weight:600}
.chip:hover{background:var(--slate-hover)}

/* ---------- subject header ---------- */
.shead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:16px 24px}
.idblock{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:12px;line-height:140%;color:var(--typography-light)}
.idblock h1{font-size:22px;font-weight:500;line-height:normal;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--typography-muted);align-items:center}
.facts .mono{font-size:12px;color:var(--typography-light)}
.phi{font-family:var(--font-mono);border:1px dashed var(--separations-divider);border-radius:4px;padding:0 6px;color:var(--typography-light);font-size:12px}
.phi.shown{border-style:solid;color:var(--orange-base);border-color:var(--orange-border)}
.hright{display:flex;flex-direction:column;gap:8px;min-width:0}
.hactions{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;justify-content:flex-end}
.embedded .hactions{padding-right:44px}
@media (max-width:1180px){.shead{grid-template-columns:1fr}.hactions{justify-content:flex-start;flex-wrap:wrap}.embedded .hactions{padding-right:0}}
/* KPI tiles: cards (8px radius, 1px separations-border) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:16px}
.kpi{background:var(--card-background);border:1px solid var(--separations-border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--typography-base)}
.kl{font-size:12px;font-weight:500;line-height:130%;color:var(--typography-muted)}
.kv2{font-size:22px;font-weight:500;line-height:normal;font-variant-numeric:tabular-nums}
.ks{font-size:12px;line-height:140%;color:var(--typography-light);overflow:hidden;text-overflow:ellipsis}
.kpi.bad .kv2{color:var(--red-base)}.kpi.warn .kv2{color:var(--orange-base)}.kpi.ok .kv2{color:var(--green-base)}

/* ---------- Tabs (45px, 2px underline, h4) ---------- */
.tabsbar{position:sticky;top:0;z-index:6;background:var(--page-light);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--separations-divider)}
.tabsbar .nav{display:flex;gap:4px;margin-left:auto}
.tabs{display:flex;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;height:45px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px;font-weight:500;color:var(--typography-muted)}
.tab:hover{color:var(--typography-base)}
.tab:focus-visible{background:var(--primary-hover);outline:0}
.tab.on{border-bottom-color:var(--primary-base);color:var(--primary-base)}

/* ---------- PanelLayout cards (10px radius, 52px card-header) ---------- */
.card{background:var(--card-background);border:1px solid var(--separations-border);border-radius:10px;min-width:0;overflow:hidden}
.card-h{background:var(--card-header);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 16px;min-height:52px;border-bottom:1px solid var(--separations-base);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:500;color:var(--typography-base)}
.card-b{padding:16px}
.infocard{margin-bottom:16px}

/* ---------- Table (dense: 36px header / 32px rows) ---------- */
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;background:var(--card-background)}
th{font-size:12px;font-weight:500;line-height:130%;color:var(--typography-base);text-align:left;padding:6px 8px 6px 16px;height:36px;border-bottom:1px solid var(--separations-base);white-space:nowrap;vertical-align:middle;text-transform:none;letter-spacing:0}
td{font-size:12px;line-height:140%;color:var(--typography-muted);border-bottom:1px solid var(--separations-base);padding:6px 8px 6px 16px;height:32px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--slate-hover)}
td.mono{font-family:var(--font-mono);white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}
.itab{width:100%}
.itab th{padding:6px 8px 6px 16px}.itab td{color:var(--typography-base);vertical-align:top}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin:0}
.kv dt{color:var(--typography-light)}.kv dd{margin:0;color:var(--typography-muted)}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 24px}
.kvgrid .k{font-size:12px;font-weight:500;color:var(--typography-light)}.kvgrid .v{font-size:14px;overflow-wrap:anywhere;color:var(--typography-base)}

/* ---------- subject matrix ---------- */
.mx{overflow-x:auto}
.mx table{min-width:720px}
.mx th,.mx td{border-bottom:1px solid var(--separations-base);padding:0;white-space:nowrap;height:auto}
.mx thead th{position:sticky;top:0;background:var(--card-background);z-index:1;vertical-align:bottom}
.mx .rl{position:sticky;left:0;background:var(--card-background);z-index:2;text-align:left;padding:6px 8px 6px 16px;font-size:12px;color:var(--typography-muted);font-weight:500;min-width:160px}
.mx th.rl{color:var(--typography-light)}
.mx .grp td{padding:16px 16px 4px;font-size:10px;line-height:120%;color:var(--typography-light);font-weight:500;border-bottom:0;background:var(--card-background)}
.mx tbody tr:hover td{background:transparent}
.mx tbody tr:not(.grp):hover td{background:var(--slate-hover)}
.vh{width:100%;border:0;background:transparent;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;color:var(--typography-base);border-radius:0}

.cell:hover:not(:disabled){background:var(--primary-hover);color:var(--typography-base)}
.cell:disabled{cursor:default}
.cell .g{min-width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex:none;font-family:var(--font-sans);padding:0 2px}
.cell .g .vi,.req .g .vi{font-size:12px;width:12px;height:12px}
.cell.ok .g{background:var(--green-hover);color:var(--green-base)}
.cell.bad .g{background:var(--red-hover);color:var(--red-base)}
.cell.warn .g{background:var(--orange-hover);color:var(--orange-base)}
.cell.info .g{background:var(--secondary-hover);color:var(--secondary-base)}
.cell.pend .g,.cell.miss .g{border:1px dashed var(--typography-light);color:var(--typography-light)}
.cell.bad{color:var(--red-base)}.cell.warn{color:var(--orange-base)}.cell.miss{color:var(--typography-light)}.cell.na{color:var(--typography-disabled)}
.cell.sel,.vh.sel{outline:2px solid var(--primary-base);outline-offset:-2px}
.vprog{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--typography-light)}
.vlegend{display:inline-flex;gap:12px;align-items:center;font-size:12px;color:var(--typography-light);flex-wrap:wrap}
.vlegend span{display:inline-flex;gap:4px;align-items:center}

/* ---------- docked panels (PanelLayout, border-left, extra-large shadow) ---------- */
.pane,.fermi{position:fixed;top:0;right:0;bottom:0;background:var(--card-background);border-left:1px solid var(--separations-border);display:flex;flex-direction:column;box-shadow:var(--shadow-extra-large)}
.pane.enter,.fermi.enter{animation:slidein 250ms var(--ease-pop)}
@keyframes slidein{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
.pane{width:min(620px,100%);z-index:18}
.jobpane{width:min(680px,100%);z-index:19}
.embedded .pane,.embedded .fermi{top:56px;border-top:1px solid var(--separations-border);border-top-left-radius:10px}
.pane>header{background:var(--card-header);display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--separations-base);min-height:52px}
.bc{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:14px}
.bc button{border:0;background:none;padding:0;color:var(--primary-base);font-weight:500}
.bc button:hover{text-decoration:underline}
.bc .sep,.bc i{color:var(--typography-light);font-style:normal;font-size:16px;width:16px;height:16px}
.bc b{font-weight:500;color:var(--typography-base)}
.pane>header,.fermi>header{flex-shrink:0}
.pane .body{flex:1;min-height:0;overflow:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
.jobpane .body{padding-bottom:72px}
.psec{display:flex;flex-direction:column;gap:8px}
.psec>h4{margin:0;font-size:12px;font-weight:500;line-height:130%;color:var(--typography-muted);display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
.acq,.sess{border:1px solid var(--separations-base);border-radius:8px;background:var(--card-background);overflow:hidden}
.acq-h{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.acq-h b{font-weight:500}
.acq-x{display:flex;gap:12px;align-items:flex-start;padding:12px;border-bottom:1px solid var(--separations-base)}
.acq-m{display:flex;flex-direction:column;gap:6px;min-width:0}
.acq-m b{font-size:14px;font-weight:500}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--separations-base);font-size:12px;color:var(--typography-muted)}
.frow .nm{font-family:var(--font-mono);overflow-wrap:anywhere;color:var(--typography-base)}
.frow .nm .tags{margin-left:6px}
.frow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.fmeta{grid-column:1/-1;background:var(--card-header);border-radius:8px;padding:8px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px}
.files{border-top:1px solid var(--separations-base)}
/* ContainedInput-style requirement rows */
.req{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--separations-base);border-radius:8px;font-size:14px;background:var(--card-background)}
.req b{font-weight:500}
.req .g{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.req.ok .g{background:var(--green-hover);color:var(--green-base)}.req.bad .g{background:var(--red-hover);color:var(--red-base)}.req.miss .g{border:1px dashed var(--typography-light);color:var(--typography-light)}
.req .mono{margin-left:auto;color:var(--typography-light);font-size:12px}

/* ---------- thumbnails: images on black (Viewer) ---------- */
.thumb{display:block;border-radius:4px;background:var(--viewport);object-fit:contain;border:1px solid var(--separations-base);flex:none}
.thumb.ph{display:grid;place-items:center;background:var(--slate-focus);color:var(--typography-light);font-size:10px;text-align:center;padding:4px}
/* Ghost shimmer */
.thumb.ph.ld{background:linear-gradient(to right,var(--slate-focus) 8%,var(--slate-hover) 18%,var(--slate-focus) 33%);background-size:800px 104px;animation:shim 1.5s linear infinite forwards;color:transparent}
@keyframes shim{0%{background-position:-468px 0}100%{background-position:468px 0}}
/* Popover (card bg, 1px border, 8px radius, menu shadow, pop-in) */
.hov,.pop{position:fixed;z-index:40;background:var(--card-background);border:1px solid var(--separations-border);border-radius:8px;box-shadow:var(--shadow-menu);animation:popin 400ms var(--ease-pop)}
@keyframes popin{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.hov{width:360px;max-height:70vh;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.pop[hidden]{display:none}
.pop{width:500px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.hov-h{display:flex;align-items:baseline;gap:8px;justify-content:space-between;font-size:14px;font-weight:500}
.hov-h .src{font-weight:400}
.hov-r{display:flex;gap:8px;align-items:flex-start}
.hov-m{display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0;color:var(--typography-muted)}
.hov-m b{font-size:14px;font-weight:500;color:var(--typography-base)}

/* ---------- AlertPanel (5% tint + 40% border, 8px radius) ---------- */
.callout,.jrec{display:flex;flex-direction:column;gap:4px;border-radius:8px;padding:10px 16px;border:1px solid var(--orange-border);background:var(--orange-hover);font-size:12px;line-height:140%;color:var(--typography-base)}
.jrec b{font-size:14px;font-weight:500;text-transform:none;letter-spacing:0}
.jrec.ok{background:var(--green-hover);border-color:var(--green-border)}.jrec.ok b{color:var(--green-base)}
.jrec.warn{background:var(--orange-hover);border-color:var(--orange-border)}.jrec.warn b{color:var(--orange-base)}
.jrec.bad{background:var(--red-hover);border-color:var(--red-border)}.jrec.bad b{color:var(--red-base)}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:10px 16px;border:1px solid var(--primary-border);background:var(--primary-hover);color:var(--primary-base);font-size:12px;line-height:140%}
.alert .vi{font-size:20px;width:20px;height:20px;margin-top:-1px}
.alert.discover{border-color:var(--secondary-border);background:var(--secondary-hover);color:var(--secondary-base)}
.alert p,.alert span{color:var(--typography-muted)}

/* ---------- gear job card ---------- */
.jhead{display:flex;flex-direction:column;gap:8px}
.jtitle{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500}
.jwhere{font-size:12px;color:var(--typography-light);display:flex;flex-wrap:wrap;gap:4px;align-items:center}.jwhere .sep,.jwhere i{font-style:normal;color:var(--typography-light);font-size:12px;width:12px;height:12px}
.jfacts{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;margin:0;font-size:12px}.jfacts dt{color:var(--typography-light)}.jfacts dd{margin:0;color:var(--typography-muted)}
.jcls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.jcls .pill{color:var(--red-base);background:var(--red-hover)}
pre.logx,.diag pre{margin:0;background:var(--page-light);border:1px solid var(--separations-base);border-radius:8px;padding:12px;font:10px/1.6 var(--font-mono);color:var(--typography-muted);overflow:auto;white-space:pre}
.diag pre{max-height:320px;border-radius:0;border-width:1px 0 0}
pre.jerr span.e{color:var(--red-base)}
.jin{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--separations-base);border-radius:8px;font-size:12px}
.jsince{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--typography-muted)}
.jsince li.ok::marker{color:var(--green-base)}.jsince li.bad::marker{color:var(--red-base)}.jsince li.warn::marker{color:var(--orange-base)}
.jsince li.ok{color:var(--green-base)}.jsince li.bad{color:var(--red-base)}
.jsame{display:flex;flex-wrap:wrap;gap:6px}
.jacts{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- diagnostics ---------- */
.diag .call{display:grid;grid-template-columns:56px 1fr auto auto;gap:12px;align-items:baseline;padding:6px 8px 6px 16px;border-bottom:1px solid var(--separations-base);font-size:12px;cursor:pointer;color:var(--typography-muted)}
.diag .call:hover{background:var(--slate-hover)}
.diag .call code{font-family:var(--font-mono);color:var(--primary-base);overflow-wrap:anywhere}
.diag .ok{color:var(--green-base)}.diag .er{color:var(--red-base)}
.call{border:1px solid var(--separations-base);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}

.qcard{border:1px solid var(--separations-base);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--card-background)}

.q-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--typography-muted)}

.q-t{font-size:14px;color:var(--typography-base)}
.q-thr{display:grid;gap:6px;border-left:2px solid var(--separations-base);padding-left:12px;font-size:12px;color:var(--typography-muted)}

.qsug{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;border:1px solid var(--separations-base);border-radius:8px;padding:8px 12px;color:var(--typography-muted)}
.qsug b{color:var(--typography-base);font-weight:500}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500;color:var(--typography-base)}
select,.fld select{height:36px;background:var(--card-background);color:var(--typography-base);border:1px solid var(--separations-input);border-radius:6px;padding:0 8px;font-size:14px;outline:0}

.fermi{width:min(460px,100%);z-index:22}

.fin{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--separations-base)}
.fin input{flex:1;height:36px;background:var(--card-background);color:var(--typography-base);border:1px solid var(--separations-input);border-radius:6px;padding:0 8px;font-size:14px;outline:0}

.fermipill{position:fixed;right:16px;bottom:64px;z-index:21;height:36px;border-radius:8px;border:0;background:var(--secondary-base);color:var(--typography-contrast);padding:8px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;box-shadow:var(--shadow-large);transition:all 300ms ease-in-out}

/* ---------- Snackbar (card-header, 4px radius, 320px, bottom-right) ---------- */
#toastHost{position:fixed;left:50%;transform:translateX(-50%);bottom:0;padding:25px;z-index:2147483000;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:8px;max-width:320px;min-width:200px;padding:8px 16px 8px 12px;background:var(--card-header);color:var(--typography-base);border:1px solid var(--separations-border);border-radius:4px;box-shadow:var(--shadow-large);font-size:14px;font-weight:500;animation:snackin 150ms var(--ease-pop)}

@keyframes snackin{from{transform:translateX(calc(100% + 25px))}to{transform:none}}

/* ---------- responsive ---------- */
.forms{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.opts{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- derived ---------- */

  summary: async () => {

    const facts = [];
    facts.push(`Visits: ${R.got}/${R.n} received (${R.cols.filter(c => c.z).map(c => esc(c.z.label) + " " + dt(c.z.timestamp).slice(0, 10)).join(", ")}).`);

    const tags = [...(s.tags || []).map(x => "subject:" + x), ...S.sessions.filter(z => (z.subject && z.subject._id) === sid).flatMap(z => (z.tags || []).map(x => z.label + ":" + x))];
    if (tags.length) facts.push(`Tags: ${tags.map(esc).join(", ")}.`);
    const q = qOf(sid); if (q.length) facts.push(`Queries: ${q.filter(x => x.status === "open").length} open, ${q.filter(x => x.status === "answered").length} answered, ${q.filter(x => x.status === "closed").length} closed.`);
    return { html: `<p><b>${esc(s.label)}</b>, data review summary. Facts only, no clinical interpretation; treatment arm omitted.</p><ul>${facts.map(f => `<li>${f}</li>`).join("")}</ul>`, tools: ["get_subject(info)", "get_visit_status(subject)", "list_reader_tasks(subject)", "list_jobs(subject)", "list_queries(subject)"] };
  },
  queries: async () => {
    const all = Object.entries(S.queries).flatMap(([sid, arr]) => arr.map(q => ({ sid, q, s: S.subjects.find(x => x._id === sid) || {} })));
    if (!all.length) return { html: `<p>No queries raised in this project yet. ${S.subj ? `This subject has ${suggestedQueries(S.subj).length} suggested by checks; ask "Why are this subject's visits incomplete?" and I'll draft them.` : ""}</p>`, tools: ["list_queries(project)"] };
    const ans = all.filter(x => x.q.status === "answered"), open = all.filter(x => x.q.status === "open").sort((a, b) => String(a.q.raised_at).localeCompare(String(b.q.raised_at)));
    return { html: `${ans.length ? `<p><b>Answered, waiting for you to close or re-query (${ans.length}):</b></p><ul>${ans.map(x => `<li>${ev(x.s.label + " · " + x.q.id, x.sid, "@queries")}: ${esc((x.q.thread || []).slice(-1)[0].text || "")}</li>`).join("")}</ul>` : ""}
      <p><b>Open with sites (${open.length}), oldest first:</b></p><ul>${open.map(x => `<li>${ev(x.s.label + " · " + x.q.id, x.sid, "@queries")} ${esc(x.q.category)} · ${esc(qTargetLabel(x.q))} · ${ago(x.q.raised_at)}</li>`).join("") || "<li>None.</li>"}</ul>`, tools: ["list_queries(project)"] };
  },
  tags: async () => {
    const cnt = {}; S.subjects.forEach(s => (s.tags || []).forEach(t => (cnt["subject · " + t] = (cnt["subject · " + t] || 0) + 1))); S.sessions.forEach(z => (z.tags || []).forEach(t => (cnt["session · " + t] = (cnt["session · " + t] || 0) + 1)));

};
function nearLabels(as, miss) { const labs = as.map(a => a.label); return miss.flatMap(m => labs.filter(l => l.toLowerCase().includes(m.label.toLowerCase().slice(0, 3)))).slice(0, 4); }
function drawFermiRaw() {
  const host = document.getElementById("fermiHost"), F = S.fermi;

      ${t.a && (t.a.tools || []).length ? `<details class="ftools"><summary>How Fermi got this</summary><ul>${t.a.tools.map(x => `<li class="mono">${esc(x)}</li>`).join("")}</ul><span class="muted">Read-only tool calls (proposed Application MCP names). Here they map to the GET calls in Diagnostics.</span></details>` : ""}</div>`).join("")}

/* ---------- events for v0.5 ---------- */
document.addEventListener("click", e => { if (!e.target.closest('[data-act="theme"]')) return; const b = document.body, dark = b.classList.contains("vision-dark"); b.classList.toggle("vision-dark", !dark); b.classList.toggle("vision-light", dark); try { localStorage.setItem("svh-theme", dark ? "light" : "dark"); } catch (er) {} renderSide(); });

document.addEventListener("click", async e => {

document.addEventListener("click", async e => {

  if (a === "diagnext") { S.diagOpen = 0; render(); }
