<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subject View</title>
<!-- Stable entry point (0.12.0). The Flywheel registration points here and never changes; every load fetches the newest
     app.html with the browser cache bypassed, so releases no longer need a registration edit (?v=N). -->
</head><body style="margin:0;background:#01010A">
<script>
(function () {
  var u = "app.html?t=" + Date.now();
  fetch(u, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (h) { document.open(); document.write(h); document.close(); })
    .catch(function (e) { document.body.innerHTML = '<p style="color:#ccc;font:14px system-ui,sans-serif;padding:24px">Subject View could not load (' + String(e && e.message || e).replace(/</g, "&lt;") + '). Reload to try again.</p>'; });
})();
</script>
</body></html>
